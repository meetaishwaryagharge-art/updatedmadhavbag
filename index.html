/* ---------- Google Apps Script backend ---------- */
async function api(action,data){
  // text/plain keeps this a "simple" request, so the browser sends no CORS preflight
  const res = await fetch(CONFIG.api,{ method:"POST", body:JSON.stringify({action,...data}) });
  return res.json();
}
async function remote(action,data){
  const r = await api(action,{token:tok(),...data});
  if(!r.ok && r.error==="auth"){ try{ sessionStorage.removeItem("dsk_tok"); }catch(e){} location.hash="login"; route(); throw new Error("auth"); }
  if(!r.ok) throw new Error(r.error||"fail");
  return r;
}
async function loadRemote(){
  if(S.loading) return;
  S.loading=true; S.loadErr=false; render();
  try{ S.records=(await remote("list",{})).records; }catch(e){ if(e.message!=="auth") S.loadErr=true; }
  S.loading=false; if(S.view==="dashboard") render();
}
/* patient results are queued locally until the server confirms them, so nothing is lost if the network drops */
const QKEY="dsk_hc_queue";
function qLoad(){ try{ return JSON.parse(localStorage.getItem(QKEY)||"[]"); }catch(e){ return []; } }
function qSave(a){ try{ localStorage.setItem(QKEY,JSON.stringify(a.slice(-50))); }catch(e){} }
let flushing=false;
async function flushQueue(){
  if(flushing||!API()) return; flushing=true;
  try{
    for(const rec of qLoad()){
      const r=await api("save",{rec});
      if(!r.ok && r.error!=="invalid") break;
      qSave(qLoad().filter(x=>x.id!==rec.id));
    }
  }catch(e){}
  flushing=false;
}
function submitRemote(rec){ qSave([...qLoad(),rec]); flushQueue(); }
window.addEventListener("online",flushQueue);

/* ---------- scoring ---------- */
const lvIdx = p => p<25?0:p<45?1:p<65?2:3;
function bmiOf(a){ const h=+a.height/100, w=+a.weight; return h>0&&w>0 ? w/(h*h) : 0; }
function compute(a){
  const bmi=bmiOf(a), wt=a.sex==="m"?90:80, w=+a.waist;
  const bmiP = bmi<18.5?1 : bmi<23?0 : bmi<25?1 : bmi<30?2 : 3;
  const wP = w>=wt+10?3 : w>=wt?2 : 0;
  const P = {
    activity:[3,2,1,0][a.activity], veg:[0,1,3][a.veg], fried:[0,1,3][a.fried],
    tobacco:[0,1,3][a.tobacco], alcohol:[0,1,3][a.alcohol], sleep:[0,1,3][a.sleep], stress:[0,1,3][a.stress], family:[0,1,2][a.family]
  };
  const nc=(a.cond||[]).filter(i=>i!==4).length, ns=(a.sym||[]).filter(i=>i!==5).length;
  const chest=(a.sym||[]).includes(0);
  const raw = {
    body:[bmiP+wP,6], activity:[P.activity,3], diet:[P.veg+P.fried,6], habits:[P.tobacco+P.alcohol,6],
    mind:[P.sleep+P.stress,6], medical:[Math.min(nc,3)+P.family+(chest?3:Math.min(ns,2)),8]
  };
  const wts = {body:25,activity:15,diet:15,habits:15,mind:10,medical:20};
  const cats={}; let tot=0;
  for(const k in raw){ cats[k]=Math.round(raw[k][0]/raw[k][1]*100); tot+=cats[k]*wts[k]; }
  const score=Math.round(tot/100); let level=lvIdx(score);
  if(chest && level<2) level=2;
  return { score, level, cats, flag:chest, bmi:+bmi.toFixed(1), waist:w };
}

async function sha256(s){
  const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
}
async function doLogin(){
  const t=tt(), u=document.getElementById("lu").value.trim(), p=document.getElementById("lp").value;
  if(Date.now()<S.lockUntil){ S.loginErr=t.loginLock; return render(); }
  if(API()){
    try{
      const r=await api("login",{user:u,pass:p});
      if(r.ok){ try{ sessionStorage.setItem("dsk_tok",r.token); }catch(e){} S.fails=0; location.hash="dashboard"; return route(); }
      S.loginErr = r.error==="locked" ? t.loginLock : t.loginErr;
    }catch(e){ S.loginErr=t.cloud.loginNet; }
    return render();
  }
  if(!(window.crypto&&crypto.subtle)){ S.loginErr=t.loginSec; return render(); }
  const ok = u===CONFIG.user && (await sha256(p))===CONFIG.hash;
  if(ok){ try{ sessionStorage.setItem("dsk_auth","1"); }catch(e){} S.fails=0; location.hash="dashboard"; route(); }
  else{ S.fails++; if(S.fails>=5){ S.lockUntil=Date.now()+30000; S.fails=0; S.loginErr=t.loginLock; } else S.loginErr=t.loginErr; render(); }
}

  }
  if(act==="multi"){
    const k=el.dataset.q, v=+el.dataset.v, none=tt().q[k].o.length-1; let cur=S.a[k]||[];
    if(v===none) cur=cur.includes(v)?[]:[v]; else { cur=cur.filter(i=>i!==none); cur=cur.includes(v)?cur.filter(i=>i!==v):[...cur,v]; }
    S.a[k]=cur; el.parentElement.querySelectorAll(".opt").forEach(b=>b.setAttribute("aria-pressed",String(cur.includes(+b.dataset.v)))); return;
  }
  if(act==="next"){ const er=validate(S.step); S.err=er; if(er) return render(); if(S.step<3){ S.step++; render(); window.scrollTo(0,0);} else finish(); return; }
  if(act==="back"){ S.err=""; S.step=Math.max(0,S.step-1); render(); window.scrollTo(0,0); return; }
  if(act==="pw"){ const i=document.getElementById("lp"); const show=i.type==="password"; i.type=show?"text":"password"; el.innerHTML=ic(show?"eye-slash":"eye")+" "+(show?t.hide:t.show); return; }
  if(act==="logout"){ if(API()){ api("logout",{token:tok()}).catch(()=>{}); try{ sessionStorage.removeItem("dsk_tok"); }catch(x){} S.records=[]; } try{ sessionStorage.removeItem("dsk_auth"); }catch(x){} location.hash="home"; return route(); }
  if(act==="export") return csv();
  if(act==="sample"){ sampleData(); return render(); }
  if(act==="clear"){ if(confirm(t.confClear)){ if(API()){ remote("clear",{}).then(()=>{ S.records=[]; render(); }).catch(()=>{ if(S.view==="dashboard"){ S.loadErr=true; render(); } }); } else { save([]); render(); } } return; }
  if(act==="refresh") return loadRemote();
  if(act==="del"){ if(confirm(t.confDel)){ const id=el.dataset.id; if(API()){ remote("delete",{id}).then(()=>{ S.records=S.records.filter(x=>x.id!==id); render(); }).catch(()=>{ if(S.view==="dashboard"){ S.loadErr=true; render(); } }); } else { save(load().filter(r=>r.id!==id)); render(); } } return; }
  if(act==="view"){ S.modal=el.dataset.id; return render(); }
  if(act==="closeModal"){ S.modal=null; return render(); }
});
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.dataset.f){ S.a[el.dataset.f]=el.value; if(S.step===1){ const b=document.getElementById("bmibox"); if(b) b.innerHTML=bmiBox(); } }
  if(el.id==="sq"){ S.q=el.value; const p=el.selectionStart; render(); const n=document.getElementById("sq"); n.focus(); n.setSelectionRange(p,p); }
});
document.addEventListener("change",e=>{ if(e.target.id==="sf"){ S.filter=e.target.value; render(); } });
document.addEventListener("submit",e=>{ if(e.target.id==="lf"){ e.preventDefault(); doLogin(); } });

flushQueue();
route();
</script>
